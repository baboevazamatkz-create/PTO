name: build-exe
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install python-docx nuitka
      # Nuitka компилирует в машинный код — у антивирусов меньше ложных срабатываний, чем у PyInstaller
      - run: >
          python -m nuitka --onefile --assume-yes-for-downloads --msvc=latest
          --windows-console-mode=disable --enable-plugin=tk-inter
          --windows-icon-from-ico=akt.ico
          --include-package-data=docx
          --include-data-files=template.docx=template.docx
          --include-data-files=akt.ico=akt.ico
          --company-name="PTO" --product-name="Akty skrytyh rabot"
          --file-version=1.0.0.0 --product-version=1.0.0.0
          --file-description="Akty osvidetelstvovaniya skrytyh rabot"
          --output-dir=dist --output-filename=akt.exe app.py
      - uses: actions/upload-artifact@v4
        with: {name: akt-windows, path: dist/akt.exe}
      - run: Compress-Archive -Path dist\akt.exe -DestinationPath akt-windows.zip
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: akt-windows.zip
